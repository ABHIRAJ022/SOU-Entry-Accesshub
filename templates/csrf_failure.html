{% extends 'base.html' %}

{% block title %}Session refreshed | Smart Campus{% endblock %}
{% block content %}
<section class="auth-panel text-center">
  <div class="auth-card">
    <div class="brand-mark mx-auto mb-4" aria-hidden="true">!</div>
    <p class="eyebrow">Session refreshed</p>
    <h1>Your form expired.</h1>
    <p class="text-secondary">For your protection, this submission was not accepted. Reload the page and submit the form again.</p>
    <a class="btn btn-primary btn-lg rounded-pill w-100 mt-3" href="{{ request.path }}">Reload secure form <span aria-hidden="true">↻</span></a>
  </div>
</section>
{% endblock %}
