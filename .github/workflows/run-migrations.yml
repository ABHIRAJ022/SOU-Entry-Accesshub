name: Run Django migrations (manual)

# Manual workflow to run Django migrations against a configured DATABASE_URL.
# Intended to be triggered by a maintainer after deployment when the app's
# serverless functions are running and the production DB is reachable.

on:
  workflow_dispatch: {}

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install system packages
        run: |
          python -m pip install --upgrade pip

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt

      - name: Run migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DJANGO_SETTINGS_MODULE: ${{ secrets.DJANGO_SETTINGS_MODULE || 'config.settings' }}
          # If your project requires other env secrets (SECRET_KEY, CLOUDINARY_URL, etc.)
          # set them in the repository Secrets before running this workflow.
        run: |
          python manage.py migrate --noinput

      - name: Show migration status
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DJANGO_SETTINGS_MODULE: ${{ secrets.DJANGO_SETTINGS_MODULE || 'config.settings' }}
        run: |
          python manage.py showmigrations --list
